# ==============================================================
# LifeHub — Docker Compose (Zero-Config NAS Deployment)
# ==============================================================
# Wie Plex/Jellyfin: Diese eine Datei + `docker compose up -d`
# Fertig. Alles startet automatisch.
#
# Usage:
#   1. Speichere diese Datei als docker-compose.yml
#   2. (Optional) .env fuer Custom-Einstellungen (siehe .env.example)
#   3. docker compose up -d
#   4. Browser: http://<NAS-IP>:3100
#
# Erster Login: Registriere den ersten User (wird Admin).
# ==============================================================

name: lifehub

services:

  # ============ Datenbank ============
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifehub}
      POSTGRES_DB: ${POSTGRES_DB:-lifehub}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - lifehub-pgdata:/var/lib/postgresql/data
      # init.sql wird aus dem Image-Ordner gemounted wenn vorhanden
      # (wird nur beim ERSTEN Start ausgefuehrt)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Cache & Queues ============
  redis:
    image: redis:7-alpine
    container_name: lifehub-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-lifehub}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - lifehub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lifehub}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============ Suche ============
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lifehub-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-lifehub}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - lifehub-meili:/meili_data

  # ============ Backend (API Server) ============
  backend:
    image: ghcr.io/ronn321/lifehub-backend:latest
    container_name: lifehub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3007}:3007"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD:-lifehub}@postgres:5432/${POSTGRES_DB:-lifehub}
      REDIS_URL: redis://:${REDIS_PASSWORD:-lifehub}@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-lifehub}
      STORAGE_BASE_PATH: /data/storage
      LIFEHUB_DATA_PATH: /data
      LIFEHUB_PHOTOS_PATH: /mnt/media/photos
      LIFEHUB_VIDEOS_PATH: /mnt/media/videos
      LIFEHUB_DOCUMENTS_PATH: /mnt/documents
      LIFEHUB_PROJECTS_PATH: /mnt/projects
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - lifehub-data:/data
      # Optional: NAS-Medien-Ordner einbinden (Photos, Videos, etc.)
      # Default: /dev/null = nicht gemounted
      - ${MEDIA_PHOTOS:-/dev/null}:/mnt/media/photos:rw
      - ${MEDIA_VIDEOS:-/dev/null}:/mnt/media/videos:rw
      - ${MEDIA_DOCUMENTS:-/dev/null}:/mnt/documents:rw
      - ${MEDIA_PROJECTS:-/dev/null}:/mnt/projects:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  # NOTE: Worker ist aktuell ein Placeholder und wird temporär deaktiviert.
  # Sobald BullMQ-Jobs implementiert sind, wird der Worker wieder aktiviert.
  # worker:
  #   image: ghcr.io/ronn321/lifehub-backend:latest
  #   container_name: lifehub-worker
  #   restart: unless-stopped
  #   command: ["node", "apps/backend/dist/apps/backend/src/worker.js"]
  #   environment: ...

  # ============ Frontend (Next.js Web UI) ============
  frontend:
    image: ghcr.io/ronn321/lifehub-frontend:latest
    container_name: lifehub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:3001"
    environment:
      # NEXT_PUBLIC_API_BASE: wenn nicht gesetzt, nutzt das Frontend
      # automatisch http://<browser-hostname>:3007/api/v1 (siehe api.ts)
      # Das funktioniert perfekt fuer NAS-Zugriff ohne Reverse Proxy.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
      NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-LifeHub}
      PORT: 3001
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      backend:
        condition: service_started

# ============ Persistente Volumes ============
volumes:
  lifehub-pgdata:
  lifehub-redis:
  lifehub-meili:
  lifehub-data:
