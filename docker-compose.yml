services:
  backend:
    container_name: lifehub-backend
    depends_on:
      cache:
        condition: service_healthy
      postgres:
        condition: service_healthy
      search:
        condition: service_started
    environment:
      CORS_ORIGINS: '*'
      DATABASE_URL: postgresql://lifehub:l1f3hub_pwd@postgres:5432/lifehub
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      LIFEHUB_DATA_PATH: /data
      MEILI_MASTER_KEY: lifehub_lifehub_32char_key!
      MEILI_URL: http://search:7700
      REDIS_URL: redis://:lifehub@cache:6379
      STORAGE_BASE_PATH: /data/storage
    image: ghcr.io/ronn321/lifehub-backend:v0.1.1
    ports:
    - 3007:3007
    restart: always
    volumes:
    - lifehub-data:/data
  cache:
    command: redis-server --requirepass lifehub --appendonly yes
    container_name: lifehub-cache
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - -a
      - lifehub
      - ping
      timeout: 3s
    image: redis:7-alpine
    restart: always
    volumes:
    - lifehub-redis:/data
  frontend:
    container_name: lifehub-frontend
    depends_on:
    - backend
    environment:
      PORT: 3001
    image: ghcr.io/ronn321/lifehub-frontend:v0.2.0
    ports:
    - 3100:3001
    restart: always
  postgres:
    container_name: lifehub-postgres
    environment:
      POSTGRES_DB: lifehub
      POSTGRES_PASSWORD: l1f3hub_pwd
      POSTGRES_USER: lifehub
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U lifehub
      timeout: 5s
    image: postgres:16-alpine
    restart: always
    volumes:
    - lifehub-pgdata:/var/lib/postgresql/data
  search:
    container_name: lifehub-search
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: lifehub_lifehub_32char_key!
      MEILI_NO_ANALYTICS: 'true'
    image: getmeili/meilisearch:v1.8
    restart: always
    volumes:
    - lifehub-meili:/meili_data
volumes:
  lifehub-data: null
  lifehub-meili: null
  lifehub-pgdata: null
  lifehub-redis: null
