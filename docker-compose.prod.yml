# LifeHub Production Stack
# Wird auf dem NAS deployed. Images von ghcr.io (GitHub Container Registry).
# Dev-Stack: docker-compose.dev.yml
# Doku: docs/DEPLOYMENT.md
#
# Konfiguration: .env Datei im gleichen Verzeichnis.
# Siehe .env.example fuer alle verfuegbaren Variablen.

name: lifehub

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # ============ Reverse Proxy ============
  traefik:
    image: traefik:v3.1
    container_name: lifehub-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--log.level=INFO"
    ports: ["443:443", "80:80"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${LIFEHUB_BASE_PATH:-.}/infrastructure/traefik:/etc/traefik
      - traefik-acme:/etc/traefik/acme.json
    networks: [lifehub]
    logging: *default-logging

  # ============ Datenbank ============
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lifehub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-lifehub}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${LIFEHUB_DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
      - ${LIFEHUB_BASE_PATH:-.}/infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lifehub]
    logging: *default-logging

  pgbouncer:
    image: bitnami/pgbouncer:1.22
    container_name: lifehub-pgbouncer
    restart: unless-stopped
    environment:
      - PGBOUNCER_DATABASES=lifehub=postgres:5432
      - PGBOUNCER_AUTH_TYPE=scram-sha-256
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=200
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [lifehub]
    logging: *default-logging

  # ============ Cache & Queues ============
  redis:
    image: redis:7-alpine
    container_name: lifehub-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    volumes:
      - ${LIFEHUB_DATA_PATH:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [lifehub]
    logging: *default-logging

  # ============ Suche ============
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lifehub-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - ${LIFEHUB_DATA_PATH:-./data}/meilisearch:/meili_data
    networks: [lifehub]
    logging: *default-logging

  # ============ Backend ============
  backend:
    image: ghcr.io/ronn321/lifehub-backend:latest
    container_name: lifehub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3007}:3007"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-lifehub}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - JWT_PRIVATE_KEY_BASE64=${JWT_PRIVATE_KEY_BASE64}
      - JWT_PUBLIC_KEY_BASE64=${JWT_PUBLIC_KEY_BASE64}
      - STORAGE_BASE_PATH=/data/storage
      - LIFEHUB_DATA_PATH=/data
      - LIFEHUB_PHOTOS_PATH=/mnt/media/photos
      - LIFEHUB_VIDEOS_PATH=/mnt/media/videos
      - LIFEHUB_DOCUMENTS_PATH=/mnt/documents
      - LIFEHUB_PROJECTS_PATH=/mnt/projects
      - TZ=${TZ:-Europe/Berlin}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3100},http://localhost:3001
    volumes:
      - ${LIFEHUB_DATA_PATH:-./data}/storage:/data/storage
      - ${LIFEHUB_PHOTOS_PATH:-/volume1/photo}:/mnt/media/photos:rw
      - ${LIFEHUB_VIDEOS_PATH:-/volume1/video}:/mnt/media/videos:rw
      - ${LIFEHUB_DATA_PATH:-./data}/thumbnails:/mnt/media/thumbnails:rw
      - ${LIFEHUB_DOCUMENTS_PATH:-/volume1/documents}:/mnt/documents:rw
      - ${LIFEHUB_PROJECTS_PATH:-/volume1/projects}:/mnt/projects:rw
      - ${LIFEHUB_DATA_PATH:-./data}/vault:/mnt/vault-blobs:rw
      - ${LIFEHUB_DATA_PATH:-./data}/tmp:/mnt/tmp:rw
    depends_on:
      postgres:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      meilisearch: { condition: service_started }
      pgbouncer:   { condition: service_started }
    networks: [lifehub]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifehub-api.rule=Host(`${LIFEHUB_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.lifehub-api.tls=true"
      - "traefik.http.routers.lifehub-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lifehub-api.middlewares=security-headers,rate-limit,compress"
      - "traefik.http.services.lifehub-api.loadbalancer.server.port=3007"
    logging: *default-logging

  # ============ Worker ============
  worker:
    image: ghcr.io/ronn321/lifehub-backend:latest
    container_name: lifehub-worker
    restart: unless-stopped
    command: ["node", "apps/backend/dist/apps/backend/src/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-lifehub}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - STORAGE_BASE_PATH=/data/storage
      - LIFEHUB_DATA_PATH=/data
      - LIFEHUB_PHOTOS_PATH=/mnt/media/photos
      - LIFEHUB_VIDEOS_PATH=/mnt/media/videos
      - LIFEHUB_DOCUMENTS_PATH=/mnt/documents
      - LIFEHUB_PROJECTS_PATH=/mnt/projects
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${LIFEHUB_DATA_PATH:-./data}/storage:/data/storage
      - ${LIFEHUB_PHOTOS_PATH:-/volume1/photo}:/mnt/media/photos:rw
      - ${LIFEHUB_VIDEOS_PATH:-/volume1/video}:/mnt/media/videos:rw
      - ${LIFEHUB_DATA_PATH:-./data}/thumbnails:/mnt/media/thumbnails:rw
      - ${LIFEHUB_DOCUMENTS_PATH:-/volume1/documents}:/mnt/documents:rw
      - ${LIFEHUB_PROJECTS_PATH:-/volume1/projects}:/mnt/projects:rw
      - ${LIFEHUB_DATA_PATH:-./data}/vault:/mnt/vault-blobs:rw
      - ${LIFEHUB_DATA_PATH:-./data}/tmp:/mnt/tmp:rw
    depends_on:
      backend: { condition: service_started }
    networks: [lifehub]
    logging: *default-logging

  # ============ Frontend ============
  frontend:
    image: ghcr.io/ronn321/lifehub-frontend:latest
    container_name: lifehub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:3001"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:${BACKEND_PORT:-3007}/api/v1
      - NEXT_PUBLIC_BRAND_NAME=${NEXT_PUBLIC_BRAND_NAME:-LifeHub}
      - TZ=${TZ:-Europe/Berlin}
    networks: [lifehub]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lifehub-web.rule=Host(`${LIFEHUB_HOST}`)"
      - "traefik.http.routers.lifehub-web.tls=true"
      - "traefik.http.routers.lifehub-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lifehub-web.middlewares=security-headers,compress"
      - "traefik.http.services.lifehub-web.loadbalancer.server.port=3001"
    logging: *default-logging

  # ============ Optional: Jellyfin ============
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: lifehub-jellyfin
    restart: unless-stopped
    profiles: ["jellyfin"]
    volumes:
      - ${LIFEHUB_VIDEOS_PATH:-/volume1/video}:/media:ro
      - ${LIFEHUB_DATA_PATH:-./data}/jellyfin:/config
    ports: ["8096:8096"]
    networks: [lifehub]
    logging: *default-logging

networks:
  lifehub: { driver: bridge }

volumes:
  traefik-acme:
