# ============================================
# LifeHub — Docker Compose
# Zero-Configuration Stack. Startet sofort.
# Optional: .env fuer Custom-Einstellungen (siehe .env.example)
# ============================================

name: lifehub

services:

  # ============ Datenbank ============
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: lifehub
      POSTGRES_DB: lifehub
      TZ: Europe/Berlin
    volumes:
      - lifehub-pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Cache ============
  redis:
    image: redis:7-alpine
    container_name: lifehub-redis
    restart: unless-stopped
    command: redis-server --requirepass lifehub --appendonly yes
    volumes:
      - lifehub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lifehub", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============ Suche ============
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lifehub-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: lifehub
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - lifehub-meili:/meili_data

  # ============ Backend ============
  backend:
    image: ghcr.io/ronn321/lifehub-backend:latest
    container_name: lifehub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3007}:3007"
    environment:
      DATABASE_URL: postgresql://lifehub:lifehub@postgres:5432/lifehub
      REDIS_URL: redis://:lifehub@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: lifehub
      STORAGE_BASE_PATH: /data/storage
      LIFEHUB_DATA_PATH: /data
      LIFEHUB_PHOTOS_PATH: /mnt/media/photos
      LIFEHUB_VIDEOS_PATH: /mnt/media/videos
      LIFEHUB_DOCUMENTS_PATH: /mnt/documents
      LIFEHUB_PROJECTS_PATH: /mnt/projects
      TZ: Europe/Berlin
      LOG_LEVEL: info
      NODE_ENV: production
    volumes:
      - lifehub-data:/data
      - ${MEDIA_PHOTOS:-/dev/null}:/mnt/media/photos:ro
      - ${MEDIA_VIDEOS:-/dev/null}:/mnt/media/videos:ro
      - ${MEDIA_DOCUMENTS:-/dev/null}:/mnt/documents:ro
      - ${MEDIA_PROJECTS:-/dev/null}:/mnt/projects:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_started }

  # ============ Worker (Background Jobs) ============
  worker:
    image: ghcr.io/ronn321/lifehub-backend:latest
    container_name: lifehub-worker
    restart: unless-stopped
    command: ["node", "apps/backend/dist/apps/backend/src/worker.js"]
    environment:
      DATABASE_URL: postgresql://lifehub:lifehub@postgres:5432/lifehub
      REDIS_URL: redis://:lifehub@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: lifehub
      STORAGE_BASE_PATH: /data/storage
      LIFEHUB_DATA_PATH: /data
      LIFEHUB_PHOTOS_PATH: /mnt/media/photos
      LIFEHUB_VIDEOS_PATH: /mnt/media/videos
      LIFEHUB_DOCUMENTS_PATH: /mnt/documents
      LIFEHUB_PROJECTS_PATH: /mnt/projects
      TZ: Europe/Berlin
    volumes:
      - lifehub-data:/data
      - ${MEDIA_PHOTOS:-/dev/null}:/mnt/media/photos:ro
      - ${MEDIA_VIDEOS:-/dev/null}:/mnt/media/videos:ro
      - ${MEDIA_DOCUMENTS:-/dev/null}:/mnt/documents:ro
      - ${MEDIA_PROJECTS:-/dev/null}:/mnt/projects:ro
    depends_on:
      - backend

  # ============ Frontend ============
  frontend:
    image: ghcr.io/ronn321/lifehub-frontend:latest
    container_name: lifehub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:3001"
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:3007/api/v1
      NEXT_PUBLIC_BRAND_NAME: LifeHub
      TZ: Europe/Berlin
    depends_on:
      - backend

volumes:
  lifehub-pgdata:
  lifehub-redis:
  lifehub-meili:
  lifehub-data:
