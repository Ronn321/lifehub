# LifeHub Development Stack
# Full Stack: Postgres, Redis, Meilisearch, Backend, Frontend
# Hot-Reload via Volume-Mounts auf src/, shared/, domains/
# Für Production: docker-compose.prod.yml

services:

  # ============ Datenbank ============
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifehub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifehub}
      TZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifehub} -d ${POSTGRES_DB:-lifehub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============ Cache & Queues ============
  redis:
    image: redis:7-alpine
    container_name: lifehub-redis-dev
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-redis_dev_password}"
      - "--appendonly"
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============ Suche ============
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lifehub-meili-dev
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_dev_master_key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============ Backend ============
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: lifehub-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3007}:3007"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD:-lifehub_dev_password}@postgres:5432/${POSTGRES_DB:-lifehub}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_dev_master_key}
      STORAGE_BASE_PATH: /data/storage
      LIFEHUB_DATA_PATH: /data
      LIFEHUB_PHOTOS_PATH: /mnt/media/photos
      LIFEHUB_VIDEOS_PATH: /mnt/media/videos
      LIFEHUB_DOCUMENTS_PATH: /mnt/documents
      LIFEHUB_PROJECTS_PATH: /mnt/projects
      NODE_ENV: development
      LIFEHUB_API_PORT: "3007"
      LOG_LEVEL: debug
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3001},http://localhost:3001
      TZ: Europe/Berlin
      # Google-Konto Integration (Werte in .env)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3007/api/v1/integrations/google/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./shared:/app/shared
      - ./domains:/app/domains
      - lifehub-data:/data
      - ${LIFEHUB_PHOTOS_PATH:-./data/photos}:/mnt/media/photos
      - ${LIFEHUB_VIDEOS_PATH:-./data/videos}:/mnt/media/videos
      - ${LIFEHUB_DOCUMENTS_PATH:-./data/documents}:/mnt/documents
      - ${LIFEHUB_PROJECTS_PATH:-./data/projects}:/mnt/projects
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }

  # ============ Frontend ============
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: lifehub-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:${BACKEND_PORT:-3007}/api/v1
      NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-LifeHub}
      NODE_ENV: development
      TZ: Europe/Berlin
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
    depends_on:
      - backend

volumes:
  postgres-data:
  meili-data:
  lifehub-data:
