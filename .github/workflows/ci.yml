# LifeHub CI
# Laeuft bei jedem Push auf main/develop und bei PRs.
# Bei Tags (v*) werden Docker Images zu ghcr.io gepusst.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifehub
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lifehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifehub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lifehub:test_password@localhost:5432/lifehub_test
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_BASE64: dGVzdA==
      JWT_PUBLIC_KEY_BASE64: dGVzdA==

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile shared + domain packages (dists for tests)
        run: |
          for pkg in shared/* domains/*; do
            if [ -f "$pkg/src/index.ts" ]; then
              (cd "$pkg" && npx tsc --outDir dist --declaration false --skipLibCheck 2>/dev/null) || true
            fi
          done

      - name: Run tests
        run: pnpm -r run test

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter @lifehub/backend build

      - name: Build frontend
        run: pnpm --filter @lifehub/frontend build

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lifehub-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lifehub-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lifehub-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/lifehub-frontend:latest
