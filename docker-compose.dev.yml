# LifeHub Development Stack
# Minimal: Postgres, Redis, Meilisearch. KEIN Tailscale, KEIN Traefik, KEIN Backup.
# Für Production: docs/DOCKER_COMPOSE_PRODUCTION.md

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifehub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lifehub}
      TZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifehub} -d ${POSTGRES_DB:-lifehub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lifehub-redis-dev
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-redis_dev_password}"
      - "--appendonly"
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: lifehub-meili-dev
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_dev_master_key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  meili-data:
