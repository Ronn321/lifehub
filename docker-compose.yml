services:
  backend:
    container_name: lifehub-backend
    depends_on:
      cache:
        condition: service_healthy
      postgres:
        condition: service_healthy
      search:
        condition: service_started
    environment:
      CORS_ORIGINS: '*'
      BROWSER_INTERNAL_HOSTS: searxng
      BROWSER_RENDERER_KEY: ${BROWSER_RENDERER_KEY:?Set BROWSER_RENDERER_KEY in .env}
      BROWSER_RENDERER_URL: http://chrome:3000
      DATABASE_URL: postgresql://lifehub:l1f3hub_pwd@postgres:5432/lifehub
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      LIFEHUB_DATA_PATH: /data
      MEILI_MASTER_KEY: lifehub_lifehub_32char_key!
      MEILI_URL: http://search:7700
      REDIS_URL: redis://:lifehub@cache:6379
      STORAGE_BASE_PATH: /data/storage
      TZ: Europe/Berlin
      # Google-Konto Integration (Werte in .env)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3007/api/v1/integrations/google/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
    image: lifehub-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
    - 3007:3007
    restart: always
    volumes:
    - lifehub-data:/data
    - C:\Users\dasil\Pictures:/data/pictures:ro
    # - D:\X-Videos:/data/videos:ro  # D: existiert nicht auf dasil VM (auskommentiert für Desktop)
    # - D:\MetaPicture:/data/metapicture:ro
  cache:
    command: redis-server --requirepass lifehub --appendonly yes
    container_name: lifehub-cache
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - -a
      - lifehub
      - ping
      timeout: 3s
    image: redis:7-alpine
    restart: always
    volumes:
    - lifehub-redis:/data
  frontend:
    container_name: lifehub-frontend
    depends_on:
    - backend
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_BASE: http://backend:3007/api/v1
    image: lifehub-frontend:local
    ports:
    - 3100:3001
    restart: always
  postgres:
    container_name: lifehub-postgres
    environment:
      POSTGRES_DB: lifehub
      POSTGRES_PASSWORD: l1f3hub_pwd
      POSTGRES_USER: lifehub
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U lifehub
      timeout: 5s
    image: postgres:16-alpine
    restart: always
    volumes:
    - lifehub-pgdata:/var/lib/postgresql/data
  search:
    container_name: lifehub-search
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: lifehub_lifehub_32char_key!
      MEILI_NO_ANALYTICS: 'true'
    image: getmeili/meilisearch:v1.8
    restart: always
    volumes:
    - lifehub-meili:/meili_data

  # Full browser engine for the Proxy Browser
  chrome:
    container_name: lifehub-chrome
    build:
      context: .
      dockerfile: infrastructure/browser-renderer/Dockerfile
    environment:
      BROWSER_INTERNAL_HOSTS: searxng
      BROWSER_PROFILE_ROOT: /data/browser-profiles
      BROWSER_MAX_DOWNLOAD_BYTES: 524288000
      BROWSER_RENDERER_KEY: ${BROWSER_RENDERER_KEY:?Set BROWSER_RENDERER_KEY in .env}
      # Neue Renderer-Tuning-/Security-Parameter (Defaults im server.js):
      BROWSER_ALLOWED_ORIGINS: ${BROWSER_ALLOWED_ORIGINS:-}
      BROWSER_DPR: ${BROWSER_DPR:-1.5}
      BROWSER_MAX_FPS: ${BROWSER_MAX_FPS:-30}
      BROWSER_HEADFUL: ${BROWSER_HEADFUL:-0}
      PORT: 3000
    ports:
    # Bind via BROWSER_RENDERER_BIND: für Prod auf die Tailscale-/LAN-IP
    # begrenzen (z.B. 100.x.y.z) statt 0.0.0.0 — der Renderer-Port muss nur
    # von LifeHub-Clients erreichbar sein, nicht vom ganzen Netz.
    - ${BROWSER_RENDERER_BIND:-0.0.0.0}:3111:3000
    restart: always
    shm_size: 2gb
    security_opt:
      - no-new-privileges:true
    # Ressourcen-Limits: Chromium frisst sonst unbegrenzt RAM/CPU und kann
    # den NAS-Host mitreißen (BROW-006/DOCKER-007).
    mem_limit: 4g
    cpus: 3.0
    pids_limit: 512
    volumes:
    - lifehub-browser-profiles:/data/browser-profiles
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Self-hosted meta-search engine (SearXNG)
  searxng:
    container_name: lifehub-searxng
    image: searxng/searxng:latest
    ports:
    - 3121:8080
    restart: always
    volumes:
    - ./infrastructure/searxng/settings.yml:/etc/searxng/settings.yml:ro
volumes:
  lifehub-data: null
  lifehub-meili: null
  lifehub-pgdata: null
  lifehub-redis: null
  lifehub-browser-profiles: null
