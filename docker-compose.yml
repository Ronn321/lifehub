services:
  backend:
    container_name: lifehub-backend
    depends_on:
      cache:
        condition: service_healthy
      postgres:
        condition: service_healthy
      search:
        condition: service_started
    environment:
      CORS_ORIGINS: '*'
      DATABASE_URL: postgresql://lifehub:l1f3hub_pwd@postgres:5432/lifehub
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      LIFEHUB_DATA_PATH: /data
      MEILI_MASTER_KEY: lifehub_lifehub_32char_key!
      MEILI_URL: http://search:7700
      REDIS_URL: redis://:lifehub@cache:6379
      STORAGE_BASE_PATH: /data/storage
    image: lifehub-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
    - 3007:3007
    restart: always
    volumes:
    - lifehub-data:/data
    - C:\Users\Robert_D_AZ_1\Pictures:/data/pictures:ro
  cache:
    command: redis-server --requirepass lifehub --appendonly yes
    container_name: lifehub-cache
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - -a
      - lifehub
      - ping
      timeout: 3s
    image: redis:7-alpine
    restart: always
    volumes:
    - lifehub-redis:/data
  frontend:
    container_name: lifehub-frontend
    depends_on:
    - backend
    environment:
      PORT: 3001
    image: lifehub-frontend:local
    ports:
    - 3100:3001
    restart: always
  postgres:
    container_name: lifehub-postgres
    environment:
      POSTGRES_DB: lifehub
      POSTGRES_PASSWORD: l1f3hub_pwd
      POSTGRES_USER: lifehub
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U lifehub
      timeout: 5s
    image: postgres:16-alpine
    restart: always
    volumes:
    - lifehub-pgdata:/var/lib/postgresql/data
  search:
    container_name: lifehub-search
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: lifehub_lifehub_32char_key!
      MEILI_NO_ANALYTICS: 'true'
    image: getmeili/meilisearch:v1.8
    restart: always
    volumes:
    - lifehub-meili:/meili_data

  # Full browser engine for the Proxy Browser
  chrome:
    container_name: lifehub-chrome
    build:
      context: .
      dockerfile: infrastructure/browser-renderer/Dockerfile
    environment:
      PORT: 3000
    ports:
    - 3111:3000
    restart: always
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
volumes:
  lifehub-data: null
  lifehub-meili: null
  lifehub-pgdata: null
  lifehub-redis: null
