# LifeHub — like Plex, for your family life
# Usage: docker compose up -d
# Then open http://<NAS-IP>:3100 and register

services:

  db:
    image: postgres:16-alpine
    container_name: lifehub-db
    restart: always
    volumes:
      - lifehub-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: lifehub
      POSTGRES_DB: lifehub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: lifehub-cache
    restart: always
    command: redis-server --requirepass lifehub --appendonly yes
    volumes:
      - lifehub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lifehub", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  search:
    image: getmeili/meilisearch:v1.8
    container_name: lifehub-search
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-lifehub_lifehub_32char_key!}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - lifehub-meili:/meili_data

  backend:
    image: ghcr.io/ronn321/lifehub-backend:latest
    container_name: lifehub-backend
    restart: always
    ports:
      - "3007:3007"
    environment:
DATABASE_URL: postgresql://lifehub:lifehub@db:5432/lifehub
      REDIS_URL: redis://:lifehub@cache:6379
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: lifehub
      STORAGE_BASE_PATH: /data/storage
      LIFEHUB_DATA_PATH: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - lifehub-data:/data
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
      search: { condition: service_started }

  frontend:
    image: ghcr.io/ronn321/lifehub-frontend:latest
    container_name: lifehub-frontend
    restart: always
    ports:
      - "3100:3001"
    environment:
      PORT: 3001
    depends_on:
      - backend

volumes:
  lifehub-pgdata:
  lifehub-redis:
  lifehub-meili:
  lifehub-data:
